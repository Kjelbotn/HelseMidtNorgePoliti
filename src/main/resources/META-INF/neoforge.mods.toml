modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mixins]]
config="helsemnpoliti.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="HMN Server"
description='''Adds police ranks, jail administration and roleplay features to the Helse Midt-Norge server.'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="SERVER"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="SERVER"

[[dependencies.${mod_id}]]
modId="ftbchunks"
type="required"
versionRange="[2101.1.0,)"
ordering="AFTER"
side="SERVER"
